<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Queen B — Break the Website</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#13051d;color:#fff;font-family:Georgia,serif;overflow:hidden}
#world{height:100dvh;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#6d278b 0,#2a0b3d 38%,#0d0414 80%);perspective:1000px}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:43px 43px;opacity:.15}
.panel{width:min(88vw,680px);height:min(70dvh,760px);border:1px solid #d6b35f88;border-radius:30px;padding:34px 24px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;background:#ffffff0c;backdrop-filter:blur(12px);box-shadow:0 30px 90px #0009;transition:.7s cubic-bezier(.2,.8,.2,1);position:relative}
.crown{font-size:64px;filter:drop-shadow(0 0 18px #f6d97888);animation:float 3s ease-in-out infinite}
h1{font-size:clamp(34px,8vw,70px);margin:4px 0;letter-spacing:.08em}.sub{font-family:Arial,sans-serif;letter-spacing:.25em;font-size:11px;color:#e6c96e}
.memory{width:78%;aspect-ratio:4/3;border-radius:22px;border:1px solid #fff3;background:linear-gradient(135deg,#fff1,#8d3ebd22);display:grid;place-items:center;position:relative;overflow:hidden;transition:.7s}
.memory:before{content:"MEMORY";font:700 12px Arial;letter-spacing:.35em;color:#ffffff88}
.counter{font:700 13px Arial;letter-spacing:.18em}.hint{font:12px Arial;color:#ffffff99}
button{border:1px solid #d9b85f;background:#d9b85f14;color:#fff;border-radius:999px;padding:15px 25px;font-weight:800;letter-spacing:.12em}
.crack{position:absolute;height:2px;background:#fff8;box-shadow:0 0 12px #fff;transform-origin:left;opacity:0;transition:.4s;pointer-events:none}
#c1{width:42%;top:34%;left:8%;transform:rotate(17deg)}#c2{width:48%;top:56%;right:3%;transform:rotate(-24deg)}#c3{width:55%;top:69%;left:20%;transform:rotate(9deg)}
.breaking .crack{opacity:1}.breaking .panel{transform:rotate(-1deg) scale(.99)}.collapse .panel{transform:rotate(5deg) translateY(30px);filter:hue-rotate(35deg)}.collapse .memory{transform:rotate(-8deg) translateX(-30px)}
.broken .panel{animation:shatter 1.1s forwards}.portal{position:absolute;width:10px;height:10px;border-radius:50%;background:#b563ff;box-shadow:0 0 60px 30px #9e4cff;opacity:0;transition:1s}
.broken .portal{opacity:1;transform:scale(35)}
@keyframes float{50%{transform:translateY(-10px)}}@keyframes shatter{to{transform:scale(1.8) rotate(16deg);opacity:0;filter:blur(12px)}}
</style></head>
<body><main id="world"><div class="stars"></div><div class="portal"></div>
<section class="panel"><div><div class="crown">♛</div><div class="sub">A BIRTHDAY REALITY FOR</div><h1>QUEEN B</h1></div>
<div class="memory"></div><div><div class="counter" id="counter">MEMORY 001 / 100</div><p class="hint" id="hint">Tap or swipe to enter the next memory</p><button id="next">NEXT MEMORY</button></div>
<div class="crack" id="c1"></div><div class="crack" id="c2"></div><div class="crack" id="c3"></div></section></main>
<script>
let n=1;const w=document.querySelector('#world'),c=document.querySelector('#counter'),h=document.querySelector('#hint'),b=document.querySelector('#next');
function render(){c.textContent=n<10?'MEMORY 00'+n+' / 100':n<100?'MEMORY 0'+n+' / 100':'MEMORY 100 / 100';
w.className='';if(n>=10){w.classList.add('breaking');c.textContent='REALITY ERROR '+String(n).padStart(3,'0')}
if(n>=26){w.classList.add('collapse');c.textContent='REALITY STABILITY: '+Math.max(1,100-n*2)+'%'}
if(n===50){b.textContent='BREAK THE WEBSITE';h.textContent='Reality can no longer contain these memories.'}
if(n>50){w.classList.add('broken');c.textContent='REALITY DEPTH: '+String(n).padStart(3,'0')+' / 100';h.textContent='You are no longer inside the website.';b.textContent='GO DEEPER'}
if(n===100){c.textContent='MEMORY 100 CANNOT BE LOADED';h.innerHTML="Because it hasn't happened yet.<br><br><b>We're still making it.</b>";b.textContent='HAPPY BIRTHDAY, BEAUX ♛'}}
function next(){if(n<100)n++;render()}b.onclick=next;
let sy=0;addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});addEventListener('touchend',e=>{if(Math.abs(e.changedTouches[0].clientY-sy)>40)next()},{passive:true});
render();
</script></body></html>
